<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FiveM | Security Test</title>
  <style>
    :root { color-scheme: dark; font-family: Tahoma, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #252a31, #090b0e 70%); color: #f5f5f5; }
    main { width: min(100%, 540px); padding: 32px; border: 1px solid #454b55; border-radius: 18px; background: #15181de8; box-shadow: 0 20px 80px #0008; }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 8px 12px; border-radius: 6px; background: #303641; color: #e5e7eb; direction: ltr; }
    h1 { margin: 22px 0 12px; font-size: 25px; }
    p { color: #b7bec8; line-height: 1.85; margin: 0 0 22px; }
    .audio-card { padding: 18px; border-radius: 12px; background: #232831; border: 1px solid #444b54; }
    label { display: block; margin-bottom: 12px; font-weight: 600; }
    audio { width: 100%; display: block; }
    small { display: block; margin-top: 14px; color: #9da6b2; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <span class="tag">FIVEM · SECURITY TEST</span>
    <h1>اختبار صفحة HTML والصوت</h1>
    <p>هذه صفحة اختبار مستقلة للتأكد من أن الاستضافة وملف MP3 يعملان. لا ترسل أحداثًا إلى FiveM ولا تحاول التحكم في شاشات اللاعبين.</p>
    <section class="audio-card">
      <label for="sample">الصوت التجريبي</label>
      <audio id="sample" controls preload="none">
        <source src="test.mp3" type="audio/mpeg">
        المتصفح لا يدعم تشغيل الصوت.
      </audio>
      <small>تقدر تستبدل الملف audio/test.mp3 بصوتك بنفس الاسم.</small>
    </section>
  </main>
</body>
</html>
